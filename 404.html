<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b315b" />
    <title>404 | StudyBreak</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; font-family: "DM Sans", system-ui, sans-serif; background: #101a2d; color: #f3f6fc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 30%, #284779, transparent 47rem), #101a2d; }
      main { width: min(100%, 790px); padding: clamp(22px, 5vw, 48px); border: 1px solid rgba(255,255,255,.12); border-radius: 30px; background: rgba(255,255,255,.055); text-align: center; box-shadow: 0 30px 90px rgba(0,0,0,.22); backdrop-filter: blur(16px); }
      img { display: block; width: min(100%, 570px); margin: 0 auto 22px; border: 1px solid rgba(255,255,255,.12); border-radius: 22px; box-shadow: 0 24px 70px rgba(0, 0, 0, .32); }
      h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 5vw, 2.5rem); }
      p { margin: 0 0 21px; color: rgba(243,246,252,.72); font-size: .9rem; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 12px 19px; border: 1px solid rgba(255,255,255,.16); border-radius: 13px; color: #172744; background: #ff8a32; box-shadow: 0 9px 22px rgba(244,124,43,.22); font-size: .82rem; font-weight: 700; text-decoration: none; transition: transform .2s ease, background .2s ease; }
      a:hover { transform: translateY(-2px); background: #ffab63; }
      a:focus-visible { outline: 3px solid #54d0c8; outline-offset: 3px; }
      @media (max-width: 480px) { main { padding: 18px; border-radius: 22px; } img { border-radius: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <img src="studybreak-logo.jpeg" alt="StudyBreak — your school-time media hub" />
      <h1>Looks like this page took a break.</h1>
      <p>That page isn’t here, but your next StudyBreak is just one click away.</p>
      <a href="./">Back to StudyBreak</a>
    </main>
  </body>
</html>
